services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caseledger
      POSTGRES_USER: caseledger
      POSTGRES_PASSWORD: caseledger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseledger"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://caseledger:caseledger@db:5432/caseledger
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
